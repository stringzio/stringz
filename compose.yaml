# Optional Postgres for local dev and self-hosting. The server requires a
# Postgres DATABASE_URL (there is no embedded database).
# Start Docker Desktop first, then: docker compose -f compose.yaml up -d postgres
# which matches the defaults in .env.example
# (DATABASE_URL=postgres://flowkit:flowkit@127.0.0.1:5432/flowkit).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowkit
      POSTGRES_PASSWORD: flowkit
      POSTGRES_DB: flowkit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowkit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
