name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets us dry-run the deploy from a branch before merging the workflow.
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history, allowlisted test fixtures only)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml --exit-code 1 --redact 100

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build (tsc -b strict + vite)
        run: bun run build
      - name: Server typecheck
        run: cd server && bun run typecheck
      - name: Lint app code
        # The 11 errors in the vendored shadcn/ui files are pre-existing;
        # app code must stay clean.
        run: bun run lint:app
      - name: Server image-parity check
        # The runtime image installs server/package.json STANDALONE (see the
        # Dockerfile deps stage), while local dev resolves from the repo-root
        # node_modules - so a dep added at the root but not to
        # server/package.json passes every local gate and kills the deploy
        # at startup (2026-10-04 docs deploy: marked). scripts/check-server-deps.py
        # walks the server module graph (including its src/lib imports) and
        # fails on any bare import missing from server/package.json.
        run: python3 scripts/check-server-deps.py

  e2e:
    runs-on: ubuntu-latest
    # Browser checks need the dev servers + Postgres. Non-blocking until the
    # harness proves stable in CI; tighten to required once it does.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowkit
          POSTGRES_PASSWORD: flowkit
          POSTGRES_DB: flowkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://flowkit:flowkit@localhost:5432/flowkit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - name: Start dev servers
        run: bun run dev:all &
      - name: Wait for api
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8787/health && exit 0
            sleep 2
          done
          echo "api did not come up"; exit 1
      - name: Browser check
        run: node scripts/browser-check.mjs

  # Wire check: pins the browser-visible JSON shape of billing.verify across
  # the api -> stringz-pay seam (fixture stub + real api + scratch postgres).
  # Blocking: this is the regression net for the envelope bugs that cost
  # multiple live debugging rounds (stringz issue #58).
  wire:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowkit
          POSTGRES_PASSWORD: flowkit
          POSTGRES_DB: flowkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://flowkit:flowkit@localhost:5432/flowkit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Wire check (billing.verify browser-visible shape)
        run: bun server/test/verify-wire-check.ts
        env:
          VERIFY_RETRY_ATTEMPTS: "2"
          VERIFY_RETRY_INTERVAL_MS: "50"

  # Auto-deploy to Cloud Run on every merge to main, after quality passes.
  # Auth is Workload Identity Federation (OIDC) - no GCP keys in GitHub.
  # workflow_dispatch is a no-infra-change dry run: it exercises the exact
  # same build+deploy path from a branch before merge.
  deploy:
    needs: [quality, wire]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/flowkit/api:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        run: |
          # --async: log streaming needs project Viewer, which the deploy SA
          # deliberately is not. Submit, then poll the build status ourselves.
          BUILD_ID=$(gcloud builds submit \
            --config=cloudbuild.yaml \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --substitutions="_IMAGE_TAG=${IMAGE_TAG},_VITE_WC_PROJECT_ID=${{ secrets.VITE_WC_PROJECT_ID }}" \
            --async --format='value(id)' --quiet)
          echo "Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project=${{ vars.GCP_PROJECT_ID }} --format='value(status)')
            echo "build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|CANCELLED|TIMEOUT) exit 1 ;;
            esac
            sleep 15
          done
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy flowkit-api --image "$IMAGE_TAG" \
            --region=${{ vars.GCP_REGION }} \
            --service-account=flowkit-api-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --add-cloudsql-instances=${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:flowkit-db \
            --set-secrets=DATABASE_URL=flowkit-database-url-internal:latest,GITHUB_CLIENT_SECRET=flowkit-github-secret:latest,STRINGZ_PAY_API_KEY=stringz-pay-api-key:latest,ADMIN_PASSWORD=admin-password:latest \
            --set-env-vars=NODE_ENV=production,SERVER_PORT=8080,GITHUB_CLIENT_ID=${{ vars.GH_OAUTH_CLIENT_ID }},PUBLIC_APP_URL=${{ vars.PUBLIC_APP_URL }},GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }},SIM_BUCKET=stringz-sim-projects,SIM_QUEUE=simulation-dispatch,SIM_QUEUE_LOCATION=${{ vars.GCP_REGION }},SIM_JOB_NAME=sim-runner,SIM_JOB_LOCATION=${{ vars.GCP_REGION }},STRINGZ_PAY_URL=https://stringz-pay-35dphqdsea-uc.a.run.app,ADMIN_EMAIL=sylusabel1@gmail.com \
            --memory=512Mi --cpu=1 --concurrency=40 --min-instances=0 --max-instances=10 \
            --timeout=3600 \
            --allow-unauthenticated --project=${{ vars.GCP_PROJECT_ID }} --quiet
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf "${{ vars.PUBLIC_APP_URL }}/api/health" && exit 0
            sleep 5
          done
          echo "deployed service did not become healthy"; exit 1

  # Build + push the simulation runner image on every merge to main (after
  # quality). Same WIF auth as the api deploy; the deploy SA has
  # artifactregistry.writer. Tags are sha-<full sha>, same convention as the
  # api image. The final step also points the Cloud Run job at the new tag -
  # without it the job keeps running the previous image until someone updates
  # it by hand (2026-10-05: the setup-events runner change shipped but the job
  # still ran the old image because this step did not exist).
  runner-image:
    needs: quality
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RUNNER_IMAGE_TAG: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/flowkit/sim-runner:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push runner image
        run: |
          BUILD_ID=$(gcloud builds submit \
            --config=runner/cloudbuild.yaml \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --substitutions="_IMAGE_TAG=${RUNNER_IMAGE_TAG}" \
            --async --format='value(id)' --quiet)
          echo "Cloud Build ID: $BUILD_ID"
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project=${{ vars.GCP_PROJECT_ID }} --format='value(status)')
            echo "build status: $STATUS"
            case "$STATUS" in
              SUCCESS) break ;;
              FAILURE|CANCELLED|TIMEOUT) exit 1 ;;
            esac
            sleep 15
          done
      - name: Point the Cloud Run job at the new image
        run: |
          gcloud run jobs update sim-runner \
            --image="${RUNNER_IMAGE_TAG}" \
            --region=${{ vars.GCP_REGION }} \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --quiet
