services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      DATABASE_URL: postgres://flowkit:flowkit@db:5432/flowkit
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flowkit
      POSTGRES_PASSWORD: flowkit
      POSTGRES_DB: flowkit
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
